# Netlify configuration for LocumsLab

[build]
  # No build step needed - pure static HTML
  publish = "."

[functions]
  # Extend timeout to 26s for Stripe checkout and Resend email functions
  node_bundler = "esbuild"

# ── Extensionless URL redirects ───────────────────────────────────────────────
# Allows locumslab.com/app to serve app.html cleanly

[[redirects]]
  from = "/app"
  to   = "/app.html"
  status = 200

[[redirects]]
  from = "/guide"
  to   = "/guide.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to   = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to   = "/terms.html"
  status = 200

[[redirects]]
  from = "/share"
  to   = "/share.html"
  status = 200

[[redirects]]
  from = "/unsubscribe"
  to   = "/unsubscribe.html"
  status = 200

# ── Canonical domain redirects ────────────────────────────────────────────────

[[redirects]]
  # www → non-www
  from = "https://www.locumslab.com/*"
  to   = "https://locumslab.com/:splat"
  status = 301
  force  = true

[[redirects]]
  # HTTP → HTTPS
  from = "http://locumslab.com/*"
  to   = "https://locumslab.com/:splat"
  status = 301
  force  = true

[[redirects]]
  # HTTP www → HTTPS non-www
  from = "http://www.locumslab.com/*"
  to   = "https://locumslab.com/:splat"
  status = 301
  force  = true

# ── Headers ───────────────────────────────────────────────────────────────────

[[headers]]
  # Security headers for all routes
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  # Never cache HTML — users always get latest deploy
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  # Cache PDFs for 7 days — rarely change
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  # Cache JS aggressively — CDN scripts don't change
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
