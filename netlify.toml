# Netlify configuration
[build]
  publish = "."
  
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Increase timeout for all functions (Anthropic API needs time)
[functions."*"]
  max_duration = 26

# Redirects for clean URLs
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/guide"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/share"
  to = "/share.html"
  status = 200

[[redirects]]
  from = "/unsubscribe"
  to = "/unsubscribe.html"
  status = 200

# Force HTTPS
[[redirects]]
  from = "https://www.locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

# Security headers WITHOUT CSP (CSP blocks Chart.js, Stripe, jsPDF which need eval)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache HTML files - no cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache PDFs
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Cache JS files
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
