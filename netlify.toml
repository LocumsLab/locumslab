# Netlify configuration
[build]
  publish = "."
  
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirects for clean URLs
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/guide"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/share"
  to = "/share.html"
  status = 200

[[redirects]]
  from = "/unsubscribe"
  to = "/unsubscribe.html"
  status = 200

# Force HTTPS
[[redirects]]
  from = "https://www.locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

# Security headers - FULLY PERMISSIVE C
