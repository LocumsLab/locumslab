# Netlify configuration
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# NOTE: the previous block used `max_duration = 26` under [functions."*"].
# Netlify's key is `timeout`, not `max_duration`, so unknown keys were silently
# ignored and every function ran under the default limit. That is why runs were
# dying at 13-15 seconds with no explanation.
#
# This block only matters for synchronous functions. The contract review now
# runs as analyze-contract-background.js, and background functions get 15
# minutes regardless of any timeout setting. Kept here for contact and
# create-checkout, and as a fallback if you ever revert the review to
# synchronous.
#
# Setting this does not by itself raise the limit. Netlify gates extended
# synchronous timeouts server-side per site, so it also needs a support request
# at answers.netlify.com naming the site and function.
[functions."analyze-contract"]
  timeout = 26

# Redirects for clean URLs
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/guide"
  to = "/guide.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/share"
  to = "/share.html"
  status = 200

[[redirects]]
  from = "/unsubscribe"
  to = "/unsubscribe.html"
  status = 200

# Force HTTPS
[[redirects]]
  from = "https://www.locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.locumslab.com/*"
  to = "https://locumslab.com/:splat"
  status = 301
  force = true

# Security headers WITHOUT CSP (CSP blocks Chart.js, Stripe, jsPDF which need eval)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache HTML files - no cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache PDFs
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Cache JS files
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap - explicit content type so Google Search Console can fetch it
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

# XML files generally
[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=3600"
