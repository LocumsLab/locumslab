<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offer Workspace — LocumsLab</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<!-- Scoring runs server-side in netlify/functions/score-offer.js. The rubric
     is never sent to the browser. -->
<style>
  .hero-dark{background:linear-gradient(160deg,#17324d,#224f78);color:#fff;border:0;border-radius:18px;
    padding:24px;margin-bottom:16px}
  .hero-dark .eyebrow{font-size:.6875rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:#9ec3ff;margin-bottom:7px}
  .hero-dark h1{font-size:1.5rem;letter-spacing:-.025em;margin:0 0 6px}
  .hero-dark p{color:#d8e6f1;font-size:.9375rem;line-height:1.55;margin:0}
  .mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
  .mini-stat{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;text-align:center}
  .mini-stat strong{display:block;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
  .mini-stat span{font-size:.6875rem;color:#c3d6e6;text-transform:uppercase;letter-spacing:.05em}

  .panel{background:#fff;border:1px solid #e5e0d7;border-radius:16px;padding:20px;margin-bottom:16px}
  .panel h2{font-size:1.0625rem;margin:0 0 3px}
  .panel .sub{font-size:.8125rem;color:#5b6573;margin:0 0 15px;line-height:1.55}

  .gwrap{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
  .gtile{width:66px;height:66px;min-width:66px;border-radius:16px;display:grid;place-items:center;
    font-size:1.9rem;font-weight:900;letter-spacing:-.04em;border:1px solid #e5e0d7;background:#fffdf8}
  .g-good{color:#12835c}.g-mid{color:#b7791f}.g-bad{color:#c2410c}.g-grey{color:#5b6573}
  .gmeta strong{display:block;font-size:.9375rem}
  .gmeta span{font-size:.8125rem;color:#5b6573;line-height:1.5}

  .meter-bar{height:7px;border-radius:99px;background:#efe5d4;margin-top:12px;overflow:hidden}
  .meter-fill{height:100%;background:#12835c;width:0%;transition:width .35s ease}
  .meter-note{font-size:.8125rem;color:#5b6573;margin-top:9px;line-height:1.55}

  .rows{border-top:1px solid #e5e0d7}
  .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #e5e0d7;
    font-size:.875rem}
  .row span:first-child{color:#5b6573}
  .row span:last-child{font-weight:650;text-align:right}
  .row .unstated{color:#b7791f;font-weight:700}

  .qitem{border-left:3px solid #b7791f;padding:2px 0 2px 14px;margin-bottom:16px}
  .qitem h4{font-size:.9375rem;margin:0 0 3px}
  .qitem p{font-size:.875rem;color:#5b6573;line-height:1.6;margin:0}
  .qitem .when{font-size:.75rem;color:#8a92a0;margin-top:5px}

  .empty{font-size:.875rem;color:#5b6573;line-height:1.65}
  .copy-row{display:flex;gap:8px;margin-top:6px}
  .copy-row input{flex:1;min-width:0;border:1px solid #e5e0d7;border-radius:10px;padding:11px 12px;
    font:inherit;font-size:.8125rem;background:#fffdf8;color:#10253f}
  .privacy{font-size:.75rem;color:#5b6573;line-height:1.6;border-top:1px solid #e5e0d7;
    padding-top:13px;margin-top:16px}
  .btn-row{display:grid;gap:9px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="logo">LocumsLab</div>
    <a class="toplink" href="offers.html">All offers →</a>
  </header>

  <div id="flash" class="flash"></div>
  <div id="ws">Loading workspace…</div>

</div>

  <footer style="text-align:center;font-size:.6875rem;color:#8a92a0;margin-top:30px;line-height:1.6;">© 2026 LocumsLab. All rights reserved. LocumsLab™ and the LocumsLab offer grade are trademarks of LocumsLab.</footer>

<script>
const token = qs('token');
const sb = getSupabase();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gClass(l){if(!l)return 'g-grey';const c=String(l).charAt(0);
  return (c==='A'||c==='B')?'g-good':c==='C'?'g-mid':'g-bad';}
function when(iso){ if(!iso) return null;
  return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }

// Profession lives in its own column rather than inside offer_data, so it
// cannot be changed by editing the form payload. Fold it in for the scorer.
function withProfession(row) {
  const o = Object.assign({}, row.offer_data || {});
  o.profession = row.profession || o.profession || 'crna_locums';
  return o;
}

function render(row, score){
  // Everything profession-specific — the terms table, the package math, the
  // completeness count — is built server-side in lib/offer-display.js.
  //
  // This page used to read extracted.<key>.value directly for ten rows and keep
  // its own 27-item copy of the scored-field list. Both broke on a profession
  // with a different field set, and the read threw AFTER the grade was
  // computed, so the failure card painted over a working page.
  const disp = score.display || { terms: [], package:{rows:[],note:''}, completeness:{} };
  const rateBand = score.rate && score.rate.band;
  const prov = score.overall.provisional;
  const qs_ = Array.isArray(row.questions) ? row.questions : [];

  const filled  = disp.completeness.scored  || 0;
  const total   = disp.completeness.total   || 0;
  const missing = disp.completeness.missing || 0;

  const publicUrl = location.origin + location.pathname.replace(/[^/]+$/, '')
    + 'offer.html?id=' + row.public_token;

  document.getElementById('ws').innerHTML =
    '<div class="hero-dark">'
    + '<div class="eyebrow">' + esc(disp.professionNoun) + ' workspace</div>'
    + '<h1>' + esc(disp.headline) + '</h1>'
    + '<p>Everything the candidate sees, plus what they have done with it.</p>'
    + '<div class="mini-stats">'
    +   '<div class="mini-stat"><strong>' + (row.opened_count || 0) + '</strong><span>Opened</span></div>'
    +   '<div class="mini-stat"><strong>' + (row.reviewed_at ? 1 : 0) + '</strong><span>Reviewed</span></div>'
    +   '<div class="mini-stat"><strong>' + qs_.length + '</strong><span>Questions</span></div>'
    + '</div></div>'

    + '<div class="panel">'
    + '<h2>The grade your candidate sees</h2>'
    + '<p class="sub">Every offer is graded against the same rubric for its profession. '
    + 'You cannot change it, and neither can we.</p>'
    + '<div class="gwrap">'
    +   '<div class="gtile ' + gClass(rateBand && rateBand.letter) + '">'
    +     esc(rateBand ? rateBand.letter : '\u2014') + '</div>'
    +   '<div class="gmeta"><strong>' + esc(score.rate.label || 'Rate') + ' \u00b7 '
    +     esc(rateBand ? rateBand.label : 'not stated') + '</strong>'
    +     '<span>' + (score.rate.hourly ? money(score.rate.hourly) + '/hr' : 'Not stated')
    +     (score.rate.blended ? ' blended. ' + esc(score.rate.basis || '') : '') + '</span></div>'
    + '</div>'
    + '<div class="gwrap" style="margin-top:14px;">'
    +   '<div class="gtile ' + (prov ? 'g-grey' : gClass(score.overall.letter)) + '">'
    +     (prov ? '\u2014' : esc(score.overall.letter)) + '</div>'
    +   '<div class="gmeta"><strong>Offer terms \u00b7 ' + esc(score.level.label) + '</strong>'
    +     '<span>' + (prov
          ? 'Not enough terms stated for a grade. The candidate sees a dash and a list of questions.'
          : esc(score.level.headline)) + '</span></div>'
    + '</div>'
    + '<div class="meter-bar"><div class="meter-fill" style="width:'
    +   (disp.completeness.pct || 0) + '%"></div></div>'
    + '<div class="meter-note"><strong>' + filled + ' of ' + total + ' graded terms stated.</strong> '
    + (missing === 0
        ? 'Nothing is left open on the candidate page.'
        : missing + ' unanswered ' + (missing === 1 ? 'question is' : 'questions are')
          + ' showing on the candidate page right now. '
          + '<a href="offer-edit.html?token=' + esc(token) + '">Fill them in</a> and the grade updates immediately.')
    + '</div></div>'

    + '<div class="panel">'
    + '<h2>What you sent</h2>'
    + '<div class="rows">'
    +   '<div class="row"><span>Package</span><span>'
    +     esc((disp.package.rows[0] && disp.package.rows[0].value) || '\u2014') + ' / week</span></div>'
    + disp.terms.map(function(t){
        return '<div class="row"><span>' + esc(t.label) + '</span>'
          + (t.stated ? '<span>' + esc(t.value) + '</span>'
                      : '<span class="unstated">Not stated</span>') + '</div>';
      }).join('')
    + '</div>'
    + '<div class="btn-row">'
    +   '<div class="copy-row"><input id="pubUrl" readonly value="' + esc(publicUrl) + '">'
    +     '<button class="btn btn-primary" id="copyBtn">Copy</button></div>'
    +   '<a class="btn btn-secondary" href="offer-edit.html?token=' + esc(token) + '">Edit this offer</a>'
    + '</div></div>'

    + '<div class="panel">'
    + '<h2>Candidate activity</h2>'
    + '<p class="sub">Whether the offer was opened, and which questions the candidate chose to send.</p>'
    + '<div class="rows">'
    +   '<div class="row"><span>First opened</span><span>' + esc(when(row.first_opened_at) || 'Not yet') + '</span></div>'
    +   '<div class="row"><span>Last opened</span><span>' + esc(when(row.last_opened_at) || '\u2014') + '</span></div>'
    +   '<div class="row"><span>Review completed</span><span>' + esc(when(row.reviewed_at) || 'Not yet') + '</span></div>'
    +   '<div class="row"><span>Questions sent</span><span>' + esc(when(row.questions_sent_at) || 'None yet') + '</span></div>'
    + '</div>'
    + '<div class="privacy">You see that the offer was opened and the questions the candidate sent you. '
    + 'You do not see their negotiation report, what they were advised to ask for, their fallback positions, '
    + 'or whether they are considering other assignments.</div>'
    + '</div>'

    + '<div class="panel">'
    + '<h2>Questions from the candidate</h2>'
    + (qs_.length
        ? '<p class="sub">Answering these in the offer itself removes them from the candidate page.</p>'
          + qs_.map(function(q){
              return '<div class="qitem"><h4>' + esc(q.label) + '</h4><p>' + esc(q.question) + '</p>'
                + '<div class="when">' + esc(when(q.sent_at)) + '</div></div>';
            }).join('')
        : '<p class="empty">No questions yet. If the candidate sends any, they appear here.'
          + (missing > 0 ? ' Most questions come from the ' + missing + ' terms you have not specified.' : '')
          + '</p>')
    + '</div>';

  const btn = document.getElementById('copyBtn');
  if (btn) btn.addEventListener('click', async function(){
    await navigator.clipboard.writeText(document.getElementById('pubUrl').value);
    btn.textContent = 'Copied';
    setTimeout(function(){ btn.textContent = 'Copy'; }, 1500);
  });
}

(async () => {
  const host = document.getElementById('ws');
  if (!token || !sb) {
    host.innerHTML = '<div class="panel"><h2>Workspace unavailable</h2>'
      + '<p class="empty">This link is missing its token, or Supabase is not configured.</p></div>';
    return;
  }
  try {
    const { data, error } = await sb.rpc('get_offer_workspace', { p_edit_token: token });
    if (error || !data || !data.length) throw new Error('not found');

    // If a recruiter is signed in, attach this offer to their agency so it
    // appears on offers.html. Silent no-op when signed out, which keeps the
    // token-only flow working exactly as before.
    try {
      const { data: sess } = await sb.auth.getSession();
      if (sess && sess.session) await sb.rpc('claim_offer', { p_edit_token: token });
    } catch (e) { /* claiming is optional */ }

    // Same grade the candidate sees, computed the same way, server-side.
    const scoreRes = await fetch('/.netlify/functions/score-offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ offer: withProfession(data[0]) })
    });
    const payload = await scoreRes.json();
    if (!scoreRes.ok || !payload.success) throw new Error(payload.error || ('HTTP ' + scoreRes.status));

    render(data[0], payload.score);
  } catch (e) {
    host.innerHTML = '<div class="panel"><h2>Workspace unavailable</h2>'
      + '<p class="empty">This link may be incorrect, or the offer may have been removed.</p></div>';
    console.error('offer-workspace: ' + (e && e.message));
  }
})();
</script>
</body>
</html>
